services:
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: minilucky_backend_api
    restart: unless-stopped
    ports:
      - "0.0.0.0:6000:6000"
    env_file:
      - ./backend/.env
    networks:
      - minilucky-network

  delivery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: minilucky_delivery_worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - backend-api
    networks:
      - minilucky-network

  admin-web:
    build:
      context: ./admin-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://luckyapi.wiai.vn/api/v1}
    container_name: minilucky_admin_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:5174:80"
    networks:
      - minilucky-network

networks:
  minilucky-network:
    driver: bridge
