name: Monorepo CI

on:
  push:
    branches: [ master, "codex/*", "agent/*" ]
  pull_request:
    branches: [ master, "codex/*" ]

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend dependencies
        run: npm --prefix backend install

      - name: Install Mini App dependencies
        run: npm --prefix lucky-wheels install

      - name: Install Admin Web dependencies
        run: npm --prefix admin-web install

      - name: Run Unit & Contract Tests
        run: npm test

      - name: Build Applications
        run: npm run build
